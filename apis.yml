aid: emulate
name: Emulate
description: 'Emulate, Inc. is a Boston, Massachusetts biotechnology company, spun
  out of Harvard''s Wyss Institute in 2014, that commercialized Organ-on-a-Chip technology
  for human-relevant preclinical research. Its Human Emulation System pairs the Ava
  Emulation System and Zoe-CM2 Culture Module instruments with Chip-S1, Chip-R1, Chip-A1
  and Chip-Array consumables and validated Organ-Chip models for Brain, Liver, Kidney,
  Lung, Duodenum Intestine, Bone Marrow, Lymphoid and Vagina, applied across toxicology,
  oncology, cell and gene therapy, immunology, infectious disease, microbiome and
  neuroscience. Emulate publishes no developer portal, API reference or SDKs; its
  software products are downloadable desktop analysis calculators and a firmware Utility
  Hub. Enrichment probing did find a real, anonymous, read-only WordPress REST API
  behind emulatebio.com carrying six first-party emulate-* namespaces for news, blog
  posts, jobs, forms, the resource library and Organ-Chip support protocols.'
