apis:
- aid: emulate:content-api
  name: Emulate Content REST API
  description: 'Anonymous, read-only REST surface behind emulatebio.com. Emulate runs
    WordPress and exposes the WordPress REST API publicly, with six first-party custom
    namespaces registered alongside the core wp/v2 namespace: emulate-in-the-news/v2
    (newsroom), emulate-posts/v2 (blog), emulate-jobs/v2 (careers), emulate-forms/v2
    (gated content forms), emulate-resources/v2 (resource library with application,
    organ-models, product and resource_type taxonomies) and emulate-support/v2 (Organ-Chip
    protocols, user guides and data-analysis tooling). No authentication is required
    and no API keys, rate-limit headers or developer documentation are published for
    it. This is a content and marketing API, not an instrument or Organ-Chip data API.'
